
<!DOCTYPE html>

<title>Gallery | Hotel Africana</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }

body {
    font-family:Arial,sans-serif;
    background:#faf8f3;
    color:#333;
}

nav {
    background:#173b2b;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo {
    color:#e4b04a;
    font-size:25px;
    font-weight:bold;
}

nav a {
    color:white;
    text-decoration:none;
    margin-left:18px;
    font-size:14px;
}

nav a:hover { color:#e4b04a; }

.header {
    text-align:center;
    padding:70px 20px;
}

.header h1 {
    color:#173b2b;
    font-size:48px;
}

.header p {
    color:#777;
    margin-top:10px;
}

.gallery {
    max-width:1150px;
    margin:auto;
    padding:20px 20px 70px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.gallery img {
    width:100%;
    height:270px;
    object-fit:cover;
    border-radius:8px;
    transition:.3s;
}

.gallery img:hover {
    transform:scale(1.03);
    opacity:.9;
}

footer {
    background:#173b2b;
    color:white;
    text-align:center;
    padding:30px;
}

@media(max-width:800px) {
    nav { flex-direction:column; }
    nav a { display:inline-block; margin:8px 4px; }
    .gallery { grid-template-columns:1fr; }
}
</style>
</head>
